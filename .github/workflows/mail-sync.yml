name: Sincronizza email Aruba

# Gira automaticamente (e si può avviare a mano da GitHub).
# NB: i cron di GitHub sono "best-effort" e possono ritardare: con repo PUBBLICO
# (minuti illimitati) conviene un intervallo frequente per compensare.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Evita esecuzioni sovrapposte.
concurrency:
  group: mail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Se mai si bloccasse di nuovo (es. un bug futuro lascia la connessione
    # email aperta), GitHub lo interrompe dopo 15 minuti invece di lasciarlo
    # appeso per ore, bloccando tutte le sincronizzazioni successive in coda
    # (concurrency qui sopra fa aspettare, non cancella, le esecuzioni dopo).
    timeout-minutes: 15
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa le dipendenze
        working-directory: mail-sync
        run: npm install --no-audit --no-fund

      - name: Sincronizza le email
        working-directory: mail-sync
        env:
          ARUBA_USER: ${{ secrets.ARUBA_USER }}
          ARUBA_PASS: ${{ secrets.ARUBA_PASS }}
          ARUBA_USER_2: ${{ secrets.ARUBA_USER_2 }}
          ARUBA_PASS_2: ${{ secrets.ARUBA_PASS_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync.mjs
